function lmap(o){const P=lmR(o.seed);return`<svg class="lm" viewBox="0 0 320 190" role="img" aria-label="Live delivery map" data-s="${o.seed}" data-st="${o.st||0}" data-dur="${o.dur||1}" data-fix="${o.fix??""}" style="width:100%;display:block;border-radius:14px;background:#E8EDE0;margin:10px 0"><path d="M0 176Q80 150 150 172T320 158V190H0Z" fill="#A9D3EC"/><text x="250" y="182" font-size="9" font-style="italic" fill="#4E8DB5">Ganga</text>${[40,120,200,280].map(x=>`<path d="M${x} 0V170" stroke="#fff" stroke-width="7"/>`).join("")}${[40,100,150].map(y=>`<path d="M0 ${y}H320" stroke="#fff" stroke-width="7"/>`).join("")}${[[60,10],[140,10],[220,10],[60,60],[140,56],[220,60],[300,56],[60,112],[140,112],[220,112],[300,112]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="44" height="24" rx="4" fill="#D5DDCB"/>`).join("")}<polyline points="${P.map(p=>p.join(",")).join(" ")}" fill="none" stroke="var(--brand,#1F6B3A)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="12" fill="#1E1E1E" stroke="#fff" stroke-width="2"/><text x="${P[0][0]}" y="${P[0][1]+5}" text-anchor="middle" font-size="13">🍳</text><text x="${P[0][0]+16}" y="${P[0][1]+4}" font-size="10" font-weight="700" fill="#17261F">Sneh Kitchen</text><circle cx="${P[3][0]}" cy="${P[3][1]}" r="12" fill="#C8312B" stroke="#fff" stroke-width="2"/><text x="${P[3][0]}" y="${P[3][1]+5}" text-anchor="middle" font-size="13">🏠</text><text x="${P[3][0]}" y="${P[3][1]-17}" text-anchor="middle" font-size="10" font-weight="700" fill="#17261F">${o.dest?o.dest.replace(/[<>&]/g,""):"You"}</text><g class="rd" transform="translate(${P[0][0]} ${P[0][1]})"><circle r="12" fill="#F5B400" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="14">🛵</text></g><rect x="6" y="6" width="96" height="20" rx="10" fill="#fff" opacity=".92"/><text class="kmtx" x="54" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#17261F"></text></svg>`}
function lmTick(){document.querySelectorAll("svg.lm").forEach(s=>{const P=lmR(+s.dataset.s),L=[0,1,2].map(i=>Math.abs(P[i+1][0]-P[i][0])+Math.abs(P[i+1][1]-P[i][1])),tot=L[0]+L[1]+L[2],t=s.dataset.fix!==""?+s.dataset.fix:Math.min(1,Math.max(0,(Date.now()-s.dataset.st)/s.dataset.dur));let d=t*tot,i=0;while(i<2&&d>L[i]){d-=L[i];i++}const a=P[i],b=P[i+1],f=d/L[i];s.querySelector(".rd").setAttribute("transform",`translate(${a[0]+(b[0]-a[0])*f} ${a[1]+(b[1]-a[1])*f})`);s.querySelector(".kmtx").textContent=t>=1?"Delivered":t<=0?"At the kitchen":((1-t)*tot*.01).toFixed(1)+" km away"})}
setInterval(lmTick,250);
function trackView(no){const h=load("sk_orders",[]),o=h.find(x=>x.no==no);if(!o)return;const L=STG(o.mode),s=stageOf(o),last=L.length-1,pk=o.mode=="Pickup";
 const tx=["We have your order","Restaurant accepted your order","Your food is being prepared",pk?"Your order is ready. Come collect it.":"Raju is on the way with your order","Delivered. Enjoy your meal!"][s];
 open(`<div id="trk"><h2 class="disp">Order #${o.no}</h2><p style="margin:0 0 8px"><span class="dm">Demo mode · time is speeded up</span></p>
 <div class="hc"><b style="font-size:19px">${tx}</b>${s<last?`<p style="margin:4px 0 0;color:var(--muted)">${pk?"Ready in about ":"Arriving in about "}${(last-s)*8} min</p>`:""}</div>
 ${pk?"":lmap({seed:parseInt(o.no.slice(2),10),st:o.at+21000,dur:7000,fix:s<3?0:s>3?1:""})}<ul class="steps">${L.map((x,i)=>`<li class="${i<=s?"on":""}${i==s?" cur":""}">${x}</li>`).join("")}</ul>
 ${!pk&&s==3?`<div class="again"><div><b>Raju</b><small style="display:block">Your delivery partner</small></div><a class="mini" href="tel:6203081726">Call</a></div>`:""}
 <div class="hc">${o.lines.map(l=>`<div class="line" style="padding:3px 0"><span>${l.q} x ${esc(l.n)}</span><span>${rs(l.q*l.p)}</span></div>`).join("")}${o.cp?`<div class="line" style="padding:3px 0;color:var(--veg)"><span>FIRST10 discount</span><span>−${rs(o.cp)}</span></div>`:""}<div class="line tot"><span>Total</span><span>${rs(o.total)}</span></div><small style="color:var(--muted)">${o.pay=="Cash"?"Pay "+(pk?"at pickup":"on delivery"):"Paid by "+(o.pay||"UPI")+" · "+(o.tx||"")}</small></div>
 ${s==last?`<div class="hc"><b>${o.r?"Thanks for rating "+o.r+" stars!":"How was your food?"}</b>${o.r?"":`<div class="stars">${[1,2,3,4,5].map(n=>`<button data-rate="${n}" data-no="${o.no}" aria-label="${n} stars">★</button>`).join("")}</div>`}</div>`:""}
 <button class="cta" data-x>Back to menu</button><a class="ghost" href="tel:6203081726" style="display:inline-block">Need help? Call us</a></div>`);
 lmTick();clearInterval(tk);tk=setInterval(()=>{if(!$("#trk")){clearInterval(tk);return}const n=load("sk_orders",[]).find(x=>x.no==no);if(n&&stageOf(n)!=s)trackView(no)},1000)}
function placeOld(){
 const g=id=>$("#"+id)?.value.trim()||"";f={n:g("fn"),p:g("fp"),a:g("fa"),note:g("fo")};
 if(!f.n)err="Enter your name.";else if(!/^[6-9]\d{9}$/.test(f.p.replace(/[\s+-]/g,"").replace(/^91(?=\d{10}$)/,"")))err="Enter a valid 10-digit mobile number.";else if(mode=="Delivery"&&f.a.length<8)err="Enter your full delivery address.";else err="";
 if(err){cartView();return}
 const t=totals(),no="SK"+Math.floor(1000+Math.random()*9000);

 const msg=`New order ${no}\n${lines}\nTotal: ${rs(t.t)} (${mode}, pay ${pay})\nName: ${f.n}\nPhone: ${f.p}${mode=="Delivery"?"\nAddress: "+f.a:""}${f.note?"\nNote: "+f.note:""}`;
 save("sk_prof",{n:f.n,p:f.p,a:f.a||(load("sk_prof",{}).a||"")});{const h=load("sk_orders",[]);h.unshift({no,at:Date.now(),mode,total:t.t,lines:Object.keys(cart).map(id=>({id:+id,n:items[id].n,q:cart[id],p:items[id].p}))});save("sk_orders",h.slice(0,20));cloud(h[0],"WhatsApp")}
 open(`<h2 class="disp">Order ${no} ready to send</h2><p>Tap the button below to send your order to the restaurant on WhatsApp.</p><ul class="steps"><li class="on">Order ready</li><li>Send on WhatsApp</li><li>Restaurant confirms</li><li>${mode=="Pickup"?"Collect at the kitchen":"On its way to you"}</li></ul><pre style="white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;font-size:14px">${esc(msg)}</pre><a class="cta" style="display:block;text-align:center;text-decoration:none" href="https://wa.me/${WA}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener" id="send">Send on WhatsApp</a><button class="ghost" id="done">Start a new order</button>`);
}
document.addEventListener("click",e=>{
 const b=e.target.closest("button,a,.sheet");if(!b)return;
 const d=b.dataset||{};
 if(d.a!=null)change(+d.a,1);else if(d.m!=null)change(+d.m,-1);
 else if(d.c){cat=d.c;renderTabs();renderMenu();renderQuick()}
 else if(d.pay){f.n=$("#fn").value;f.p=$("#fp").value;f.a=$("#fa")?.value||f.a;f.note=$("#fo").value;pay=d.pay;cartView()}
 else if(d.mode){f.n=$("#fn").value;f.p=$("#fp").value;f.a=$("#fa")?.value||f.a;f.note=$("#fo").value;mode=d.mode;cartView();bar()}
 else if(b.id=="veg"){veg=!veg;b.setAttribute("aria-pressed",veg);renderMenu()}
 else if(d.cpn!=null){cpn=d.cpn=="1";cartView()}

 else if(d.cd!=null){cS=+d.cd;calView()}
 else if(d.cm!=null){const x=new Date(cY,cM+ +d.cm,1);cY=x.getFullYear();cM=x.getMonth();const n=new Date();cS=cY==n.getFullYear()&&cM==n.getMonth()?n.getDate():1;calView()}
 else if(b.id=="cal"){const n=new Date();cY=n.getFullYear();cM=n.getMonth();cS=n.getDate();calView()}
 else if(b.id=="dpx")$("#daypop").hidden=true;
 else if(b.id=="help")helpView();
 else if(b.id=="myo")histView();
 else if(b.id=="login"){if(user)acctView();else{lg={p:"",n:"",step:0,e:""};loginView()}}
 else if(b.id=="otp"){const v=($("#lp")?.value||"").trim(),k=v.toLowerCase()=="owner"?"owner":STF[v];if(k){lg.id=k;lg.e="";lg.step=2;loginView();return}const p=v.replace(/\D/g,"");lg.p=p;if(!/^[6-9]\d{9}$/.test(p))lg.e="Enter a valid 10-digit mobile number.";else{lg.e="";lg.step=1}loginView()}
 else if(b.id=="vfy"){const o=$("#lo").value.trim(),n=$("#ln").value.trim();lg.n=n;if(!/^\d{4}$/.test(o))lg.e="Enter the 4-digit OTP.";else if(n.length<2)lg.e="Enter your name.";else{user={n,p:lg.p};save("sk_user",user);f.n=n;f.p=lg.p;who();lg.e="";lg.e="";welcome();return}loginView()}
 else if(b.id=="pin"){if($("#lk").value!="1234"){lg.e="Wrong PIN. Please try again.";loginView();return}welcome(lg.id);return;open(`<div style="text-align:center;padding:20px 0"><div class="ok">\u2713</div><h2 class="disp">Welcome, ${lg.id=="owner"?"Owner":lg.id[0].toUpperCase()+lg.id.slice(1)}</h2><p style="color:var(--muted)">Open your panel to manage orders.</p><a class="cta" style="display:block;text-decoration:none" href="${DASH}#as-${lg.id}" target="_blank" rel="noopener">Open dashboard</a></div><button class="ghost" data-x>← Back to menu</button>`)}
 else if(b.id=="go")goMenu();
 else if(b.id=="chg"){lg.step=0;lg.e="";loginView()}
 else if(b.id=="gomy")histView();
 else if(b.id=="lgout"){user=null;try{localStorage.removeItem("sk_user")}catch(x){}who();close()}
 else if(d.tr){trackView(d.tr)}
 else if(d.rate!=null){const h=load("sk_orders",[]),o=h.find(x=>x.no==d.no);if(o){o.r=+d.rate;save("sk_orders",h);trackView(d.no)}}
 else if(d.pm){readPay();pm=d.pm;payView()}
 else if(b.id=="pay")payNow();
 else if(b.id=="b2c")cartView();
 else if(b.id=="place")place();
 else if(b.id=="done"){cart={};err="";save("sk_cart",{});close();bar();renderMenu();renderQuick()}
 else if(d.x!=null||b===$("#sheet")&&e.target===b)close();
});
