<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sneh Kitchen – Login</title>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F0EA;--sf:#fff;--ink:#17261F;--mu:#5E6B64;--ln:#DAD8CE;--br:#1F6B3A;--onbr:#fff;--ac:#F5B400;--onac:#2A2000;--hero:#161915;--rd:#C8312B;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1511;--sf:#17201A;--ink:#EAF0E4;--mu:#9BB0A1;--ln:#2D3B31;--br:#5CC47A;--onbr:#0B1A10;--hero:#0A0D0A;--rd:#EF6A62}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1511;--sf:#17201A;--ink:#EAF0E4;--mu:#9BB0A1;--ln:#2D3B31;--br:#5CC47A;--onbr:#0B1A10;--hero:#0A0D0A;--rd:#EF6A62}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 Mukta,system-ui,sans-serif}
header{background:radial-gradient(600px 240px at 85% -30%,color-mix(in srgb,var(--br) 45%,transparent),transparent 70%),var(--hero);color:#F2F5EC;text-align:center;padding:30px 16px 34px;border-bottom:4px solid var(--ac)}
header img{width:104px;height:104px;border-radius:50%;box-shadow:0 0 0 3px var(--hero),0 0 0 5px var(--br);display:block;margin:0 auto 12px}
h1,h2{font-family:'Yatra One',Mukta,serif;font-weight:400;margin:0}h1{font-size:clamp(30px,8vw,42px)}h2{font-size:24px;margin-bottom:6px}
header p{margin:4px 0 0;opacity:.85}
main{max-width:460px;margin:-18px auto 0;padding:0 16px 40px}
.roles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.role{border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:14px;padding:12px 4px;font:inherit;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 6px 14px -10px rgba(0,0,0,.4)}
.role span{font-size:26px;line-height:1}
.role[aria-pressed=true]{background:var(--br);color:var(--onbr);border-color:var(--br)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:20px;margin-top:12px;box-shadow:0 10px 24px -16px rgba(0,0,0,.45)}
.mu{color:var(--mu);margin:0 0 6px}
label{display:block;font-weight:600;margin:12px 0 4px;font-size:15px}
input{width:100%;padding:11px 12px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.cta{display:block;width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:var(--br);color:var(--onbr);font:inherit;font-weight:700;text-align:center;text-decoration:none;cursor:pointer}
.ghost{background:none;border:0;color:var(--mu);text-decoration:underline;padding:10px 0 0;font:inherit;cursor:pointer;display:block;margin:0 auto}
.err{color:var(--rd);font-size:14px;margin:6px 0 0;min-height:1.3em}
.okc{text-align:center}.tick{width:64px;height:64px;border-radius:50%;background:var(--br);color:var(--onbr);display:grid;place-items:center;font-size:34px;margin:0 auto 10px}
details{margin-top:14px;background:var(--sf);border:1px dashed var(--ln);border-radius:14px;padding:12px 16px}summary{font-weight:600;cursor:pointer}
.dl{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--ln);margin-top:8px}.dl span{font-weight:600;width:70px}.dl code{flex:1;color:var(--mu)}
.use{border:1.5px solid var(--br);background:none;color:var(--br);border-radius:99px;padding:3px 14px;font:inherit;font-weight:600;cursor:pointer}
small{color:var(--mu);display:block;margin-top:10px}
footer{text-align:center;color:var(--mu);font-size:14px;padding:0 16px 30px}footer a{color:var(--ink)}
</style><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🍽️%3C/text%3E%3C/svg%3E">

<main>
<div class="roles" role="group" aria-label="Choose who you are">
<button class="role" data-t="c" aria-pressed="true"><span>🍽️</span>Customer</button>
<button class="role" data-t="o" aria-pressed="false"><span>🏪</span>Owner</button>

<div class="card" id="panel"></div>

<div class="dl"><span>Sonu</span><code>9876500003 · 1234</code><button class="use" data-t="d" data-id="9876500003">Use</button></div>

</main>

<script>
const CUST="customer.html",DASH="dashboard.html";
const U={owner:{n:"Owner",role:"o"},"9876500002":{n:"Raju",role:"d"},"9876500003":{n:"Sonu",role:"d"}},PIN="1234";
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tab="c",ok=null,err="",idv="",pinv="";
function render(){
 document.querySelectorAll(".role").forEach(b=>b.setAttribute("aria-pressed",b.dataset.t==tab&&!ok||ok&&b.dataset.t==ok.role));
 const p=$("#panel");
 if(ok){p.innerHTML=`<div class="okc"><div class="tick">✓</div><h2>Welcome, ${esc(ok.n)}</h2><p class="mu">${ok.role=="o"?"Your dashboard is ready.":"Your deliveries are ready."}</p><a class="cta" href="${ok.url}">Open ${ok.role=="o"?"owner dashboard":"delivery screen"} →</a><button class="ghost" id="out">Log out</button></div>`;return}
 if(tab=="c"){p.innerHTML=`<h2>Order food</h2><p class="mu">No login needed. Browse the menu and get 10% off your first order with FIRST10.</p><a class="cta" href="${CUST}">Start ordering →</a>`;return}
 const o=tab=="o";
 p.innerHTML=`<h2>${o?"Owner login":"Delivery login"}</h2><label for="id">${o?"Owner ID":"Mobile number"}</label><input id="id" autocomplete="username" inputmode="${o?"text":"numeric"}" placeholder="${o?"owner":"10-digit number"}" value="${esc(idv)}"><label for="pn">PIN</label><input id="pn" type="password" inputmode="numeric" autocomplete="current-password" value="${esc(pinv)}"><p class="err" role="alert">${err}</p><button class="cta" id="go">Log in</button>`}
function login(){const u=U[idv.trim().toLowerCase()];
 if(!u||u.role!=tab||pinv!=PIN){err="Wrong ID or PIN. Please try again.";render();return}
 err="";ok={n:u.n,role:u.role,url:DASH+"#as-"+(u.role=="o"?"owner":u.n.toLowerCase())};render()}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.classList.contains("use")){tab=b.dataset.t;idv=b.dataset.id;pinv=PIN;err="";ok=null;render();$("#panel").scrollIntoView({behavior:"smooth",block:"center"})}
 else if(b.classList.contains("role")){tab=b.dataset.t;ok=null;err="";render()}
 else if(b.id=="go")login();else if(b.id=="out"){ok=null;idv="";pinv="";render()}});
document.addEventListener("input",e=>{if(e.target.id=="id")idv=e.target.value;else if(e.target.id=="pn")pinv=e.target.value});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&(e.target.id=="id"||e.target.id=="pn"))login()});
render();
</script></body></html>
