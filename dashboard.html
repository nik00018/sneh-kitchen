<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sneh Kitchen – Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1F0EA;--sf:#fff;--ink:#17261F;--mu:#68756E;--ln:#E2E0D6;--br:#C62F28;--sb:#1B1B1B;--sbt:#D6D3CC;--ac:#F5B400;--onac:#2A2000;--gr:#1E8E3E;--rd:#C8312B;--bl:#2B6CB0;--hv:#F7F6F1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0B1310;--sf:#142019;--ink:#EDEBE3;--mu:#94A39B;--ln:#25352D;--br:#F2B705;--sb:#101C16;--sbt:#A9BDB1;--gr:#4CC26C;--rd:#EF6A62;--bl:#6BA8E8;--hv:#1A2A22}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1310;--sf:#142019;--ink:#EDEBE3;--mu:#94A39B;--ln:#25352D;--br:#F2B705;--sb:#101C16;--sbt:#A9BDB1;--gr:#4CC26C;--rd:#EF6A62;--bl:#6BA8E8;--hv:#1A2A22}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Hind,system-ui,sans-serif}
h1,h2,h3,.d{font-family:'Bricolage Grotesque',Hind,sans-serif;margin:0}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{background:var(--sb);color:var(--sbt);padding:20px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;gap:10px;align-items:center;padding:0 8px 18px;color:#fff}
.logo i{width:34px;height:34px;border-radius:10px;background:var(--ac);color:var(--onac);display:grid;place-items:center;font:800 14px 'Bricolage Grotesque',sans-serif}
.logo b{font:800 17px 'Bricolage Grotesque',sans-serif;line-height:1.1}
.logo small{display:block;font:400 12px Hind;opacity:.7}
aside button.nv{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:10px 12px;color:inherit;font-weight:500}
aside button.nv[aria-pressed=true]{background:rgba(255,255,255,.12);color:#fff}
aside button.nv .n{margin-left:auto;background:var(--ac);color:var(--onac);border-radius:99px;font-size:12px;font-weight:700;padding:0 8px}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px 8px;border-top:1px solid rgba(255,255,255,.12);font-size:14px;color:#fff}
.av{width:32px;height:32px;border-radius:50%;background:var(--ac);color:var(--onac);display:grid;place-items:center;font-weight:700}
.main{padding:22px 28px 40px;min-width:0}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:28px;font-weight:800}
.top p{margin:0;color:var(--mu)}
.live{display:inline-flex;gap:6px;align-items:center;font-size:13px;font-weight:600;color:var(--gr)}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gr);animation:pl 1.6s infinite}
@keyframes pl{50%{opacity:.25}}
@media(prefers-reduced-motion:reduce){.live::before{animation:none}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.kpi span{color:var(--mu);font-size:14px}
.kpi b{display:block;font:800 30px/1.2 'Bricolage Grotesque',sans-serif;margin:2px 0}
.dl{font-size:13px;font-weight:600}.up{color:var(--gr)}.dn{color:var(--rd)}
.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:14px}
.card h3{font-size:17px;margin-bottom:2px}
.card .sub{color:var(--mu);font-size:13px;margin-bottom:10px}
.bar{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:9px 0;font-size:14px}
.bar div.t{height:8px;border-radius:4px;background:var(--ln);margin-top:3px}
.bar div.t i{display:block;height:100%;border-radius:4px;background:var(--br)}
.bar span.v{text-align:right;color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;color:var(--mu);padding:8px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
td{padding:11px 10px;border-bottom:1px solid var(--ln);vertical-align:middle}
tbody tr[data-o]{cursor:pointer}tbody tr[data-o]:hover{background:var(--hv)}
.scroll{overflow-x:auto}
.pill{display:inline-block;border-radius:99px;padding:1px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
.s0{background:#FCEFC2;color:#6B4E00}.s1{background:#DCE9F8;color:#1B4E87}.s2{background:#E7DDF6;color:#51308A}.s3{background:#D7F0DE;color:#14622B}.s4{background:#F8DAD7;color:#8A1F19}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .s0{background:#3D3208;color:#F5D66B}:root:not([data-theme="light"]) .s1{background:#14304F;color:#9CC5F0}:root:not([data-theme="light"]) .s2{background:#2F2147;color:#C9B2EE}:root:not([data-theme="light"]) .s3{background:#133A20;color:#7EDB9B}:root:not([data-theme="light"]) .s4{background:#4A1B18;color:#F2A19B}}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:4px 13px;font-size:14px}
.tabs button[aria-pressed=true]{background:var(--br);color:var(--sb);border-color:var(--br)}
:root:not([data-theme="dark"]) .tabs button[aria-pressed=true]{color:#fff}
input,select{padding:8px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);font:inherit}
.tools input{flex:1;min-width:180px;max-width:300px}
.btn{border:0;border-radius:10px;padding:8px 14px;background:var(--br);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn{color:var(--onac)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:var(--onac)}}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.r{background:transparent;color:var(--rd);border:1px solid var(--rd)}
.dot{width:12px;height:12px;border:2px solid var(--gr);border-radius:3px;display:inline-grid;place-items:center;margin-right:8px;vertical-align:-1px}
.dot::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--gr)}
.dot.nv{border-color:var(--rd)}.dot.nv::after{background:var(--rd)}
.sw{border:1px solid var(--ln);background:var(--sf);border-radius:99px;padding:2px 12px;font-size:13px;font-weight:600}
.sw[aria-pressed=true]{background:var(--gr);color:#fff;border-color:var(--gr)}
.pin{width:84px}
.drawer{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.45);display:none;justify-content:flex-end}
.drawer.on{display:flex}
.dp{background:var(--sf);width:min(420px,100%);height:100%;overflow:auto;padding:20px}
.tl{margin:14px 0;padding-left:4px}
.tl div{display:flex;gap:10px;align-items:center;padding:5px 0;color:var(--mu)}
.tl div i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ln);flex:none}
.tl div.on{color:var(--ink);font-weight:600}.tl div.on i{background:var(--gr);border-color:var(--gr)}
.ln{display:flex;justify-content:space-between;padding:5px 0}
.ln.t{border-top:1px solid var(--ln);margin-top:6px;padding-top:10px;font-weight:700}
.toast{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);display:none;max-width:320px}
.toast.on{display:block}
.app[hidden]{display:none}
.demo{background:#111;color:#fff;display:flex;gap:6px;align-items:center;justify-content:center;padding:8px}
.demo small{opacity:.7;margin-right:4px}
.demo button{border:0;border-radius:99px;padding:5px 16px;background:transparent;color:inherit;font-weight:600}
.demo button[aria-pressed=true]{background:var(--ac);color:var(--onac)}
a.btn{display:inline-block;text-decoration:none;text-align:center}
.dv{max-width:480px;margin:0 auto;padding:18px 16px 40px}
.dv .card{margin:12px 0}
.big{width:100%;margin-top:12px;padding:14px;font-size:16px}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1;padding:11px}
.pay{font-weight:700}
.dstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.dstats div{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:10px;text-align:center}
.dstats b{display:block;font:800 22px 'Bricolage Grotesque',sans-serif}.dstats span{font-size:12px;color:var(--mu)}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:10px;align-items:end;margin-bottom:14px}
.form label{font-size:13px;font-weight:600;color:var(--mu);display:block;margin-bottom:3px}
.form input,.form select{width:100%}
@media(max-width:900px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:10px}.logo{padding:0 10px 0 4px}.me{display:none}aside button.nv{width:auto;white-space:nowrap}.grid{grid-template-columns:1fr}.main{padding:16px}.form{grid-template-columns:1fr 1fr}}
.logo img{width:40px;height:40px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 2px var(--ac)}
</style>

</head>

const MENU_RAW={"Pizza ka Kissa":"Royal Margherita Pizza (Small)|119;Royal Margherita Pizza (Medium)|159;Sweet Corn Classic Pizza (Small)|139;Sweet Corn Classic Pizza (Medium)|199;Fresh Farm Delight Pizza (Small)|189;Fresh Farm Delight Pizza (Medium)|229;Onion Burst Pizza (Small)|129;Onion Burst Pizza (Medium)|169;Tandoori Paneer Pizza (Small)|199;Tandoori Paneer Pizza (Medium)|269;Mixed Veg Cheese Pizza (Small)|189;Mixed Veg Cheese Pizza (Medium)|249;Mini Bun Pizza|89;Kulhad Pizza|79;Sneh Special Chaar Swad Pizza (Medium)|329","Paneer Special":"Sahi Paneer|229;Chilli Paneer|119;Paneer Pakoda (6 pcs)|149;Matar Paneer|249;Paneer Do Pyaza|239;Kadai Paneer|249","Biryani":"Paneer Biryani with Raita|220;Veg Biryani with Raita|199","Combo Meals":"Noodles + Fries + Veggie Roll|159;Noodles + Paneer Chilli + Fries|199;Noodles + Fries + Cup Cake|149;Sweet Corn Pizza + Coke + Fries|239;Farm House Pizza + Coke|199;Mix Veg Pizza + Cheese Burger + Coke|249;Fried Rice + Chilli Paneer (Half)|209;Jeera Rice + Kadai Paneer (Half) + Green Salad|327","Paratha Section":"Roti|14;Laccha Paratha|29;Aloo Paratha (2 pcs)|89;Paneer Paratha (2 pcs)|99","Maggie ki Kahani":"Plain Maggie|49;Ghar Wali Veggies Maggie|69;Cheesy Melt Maggie|79;Paneer Veggie Cheesy Maggie|89","Momos ka Mantra":"Steamed Momos (6 pcs)|79;Fried Momos (6 pcs)|89;Paneer Steamed Momos (6 pcs)|109;Paneer Kurkure Momos (6 pcs)|149","Chauming ki Chahat":"Veggie Chowmein|69;Paneer Chowmein|89","Roll ka Raaz":"Veggie Cheesy Roll|69;Paneer Tikka Roll|79","Burger ka Bawal":"Sneh Classic Veg Burger|69;Cheesy Classic Veg Burger|79;Sneh Burger Pizza|89","Sandwich ka Sandesh":"Cheesy Corn Sandwich|59;Sneh Classic Veg Sandwich|69;Paneer Corn Cheesy Sandwich|89","Fries ka Funda":"Peri Peri Fries|69;Cheese Fries|79;Honey Chilli Potato|99;Crispy Corn|59;Pop Corn|49;Garlic Bread (4 pcs)|99;Garlic Bread (2 pcs)|79","Pasta ka Panga":"Red Sauce Pasta|79;Cheesy Red Sauce Pasta|89","Desserts":"Cup Cake|40;Waffle|99","Drinks":"Banana Shake|89;Oreo Shake|80;Hot Coffee|79;Sprite 250 ml|30;Coke 250 ml|30"};
const CATS=Object.keys(MENU_RAW);
const NAMES=["Rohit Kumar","Anita Sharma","Vikram Singh","Pooja Verma","Amit Raj","Sneha Gupta","Manish Yadav","Neha Kumari","Rahul Das","Priya Jha","Sanjay Mehta","Kajal Roy"];
let M=[];let _id=1;for(const c in MENU_RAW)MENU_RAW[c].split(";").forEach(s=>{const[n,p]=s.split("|");M.push({id:_id++,n,c,p:+p,v:1,on:1})});
const S={role:"o",staff:[{n:"Raju",ph:"9876500002"},{n:"Sonu",ph:"9876500003"}],pg:"ov",f:"All",q:"",mq:"",orders:[],seq:1060,open:null,week:[11400,12800,10950,13600,15200,17800],yday:14200};
let seed=7;const rnd=n=>(seed=(seed*9301+49297)%233280)/233280*n|0;
function mk(i,s,time){const k=1+rnd(3),it=[];for(let j=0;j<k;j++){const m=M[rnd(M.length)];if(!it.find(x=>x.id==m.id))it.push({id:m.id,n:m.n,q:1+rnd(2),p:m.p})}
 const sub=it.reduce((a,b)=>a+b.q*b.p,0),dl=rnd(4)==0;return{id:S.seq-i,who:NAMES[rnd(NAMES.length)],type:dl?"Pickup":"Delivery",it,total:sub+(dl||sub>=299?0:30),s,at:time,pay:rnd(2)?"UPI":"Cash",by:null,ph:"98"+(10000000+rnd(89999999)),ad:["Station Road","Ahirauli","Chowk Bazar","Civil Lines","Dumraon Road","Court Road"][rnd(6)]+", Buxar"}}
for(let i=0;i<14;i++)S.orders.push(mk(14-i,i<9?3:i<11?2:i<13?1:0,(11+Math.floor(i*.85))%12+1+":"+(10+i*3%50)+(i<2?" am":" pm")));
S.orders.reverse();
const T=S.orders.reduce((a,o)=>a+o.total,0);S.yday=Math.round(T/1.14/10)*10;S.week=[.72,.85,.78,.95,1.04].map(f=>Math.round(T*f/10)*10).concat(S.yday);
S.orders.forEach((o,i)=>{if(o.s==1||o.s==2)o.type="Delivery";if(o.type=="Delivery"&&o.s>0&&o.s<4)o.by=o.s==3&&i%2?"Sonu":"Raju"});
const $=s=>document.querySelector(s),rs=n=>"₹"+Number(n).toLocaleString("en-IN");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pill=s=>`<span class="pill s${s}">${ST[s]}</span>`;
const todaySales=()=>S.orders.filter(o=>o.s<4).reduce((a,o)=>a+o.total,0);

function chart(){const d=[...S.week,todaySales()],days=[6,5,4,3,2,1,0].map(k=>new Date(Date.now()-k*864e5).toLocaleDateString("en-IN",{weekday:"short"})),mx=Math.max(...d)*1.15;
 return`<svg viewBox="0 0 440 190" width="100%" role="img" aria-label="Sales for the last 7 days">${[0,.5,1].map(g=>`<line x1="38" x2="440" y1="${160-g*140}" y2="${160-g*140}" stroke="var(--ln)"/><text x="32" y="${164-g*140}" text-anchor="end" font-size="10" fill="var(--mu)">${Math.round(mx*g/1000)}k</text>`).join("")}${d.map((v,i)=>{const h=v/mx*140,x=50+i*54;return`<rect x="${x}" y="${160-h}" width="34" height="${h}" rx="6" fill="${i==6?"var(--ac)":"var(--br)"}"><title>${days[i]}: ${rs(v)}</title></rect><text x="${x+17}" y="178" text-anchor="middle" font-size="11" fill="var(--mu)">${days[i]}</text>`}).join("")}</svg>`}
function breakdown(){
 const ls=S.orders.filter(o=>o.s<4),cat={},prd={};
 ls.forEach(o=>o.it.forEach(i=>{const m=M.find(x=>x.id==i.id),c=m?m.c:"Other",r=i.q*i.p;(cat[c]=cat[c]||{r:0,q:0}).r+=r;cat[c].q+=i.q;(prd[i.n]=prd[i.n]||{r:0,q:0,o:0,c}).r+=r;prd[i.n].q+=i.q;prd[i.n].o++}));
 const tot=Object.values(cat).reduce((a,b)=>a+b.r,0);if(!tot)return"";
 const cs=Object.entries(cat).map(([n,v])=>({n,...v})).sort((a,b)=>b.r-a.r),top=cs.slice(0,5),rest=cs.slice(5).reduce((a,b)=>a+b.r,0),cl=rest?[...top,{n:"Other",r:rest}]:top;
 const col=["#C62F28","#F5B400","#1E8E3E","#2B6CB0","#7A4FD1","#B5651D"],C=2*Math.PI*54;let acc=0;
 const seg=cl.map((x,i)=>{const len=x.r/tot*C,e=`<circle r="54" cx="70" cy="70" fill="none" stroke="${col[i]}" stroke-width="22" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-acc}" transform="rotate(-90 70 70)"><title>${esc(x.n)}: ${rs(x.r)}</title></circle>`;acc+=len;return e}).join("");
 const leg=cl.map((x,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:4px 0"><i style="width:12px;height:12px;border-radius:3px;background:${col[i]};flex:none"></i><span style="flex:1">${esc(x.n)}</span><b>${rs(x.r)}</b><small style="color:var(--mu);width:38px;text-align:right">${Math.round(x.r/tot*100)}%</small></div>`).join("");
 const pl=Object.entries(prd).map(([n,v])=>({n,...v})).sort((a,b)=>b.r-a.r),mq=Math.max(...pl.map(p=>p.q)),mo=pl.find(p=>p.q==mq),mr=pl[0].r;
 const bd=t=>` <span style="background:var(--ac);color:var(--onac);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700">${t}</span>`;
 const rows=pl.slice(0,6).map((p,i)=>`<div style="padding:8px 0;border-top:1px solid var(--ln)"><div style="display:flex;justify-content:space-between;gap:8px"><span><b>${i+1}. ${esc(p.n)}</b>${p.q==mq?bd("Most ordered"):""}${i==0?bd("Top earner"):""}<br><small style="color:var(--mu)">${esc(p.c)} · ${p.q} sold in ${p.o} ${p.o>1?"orders":"order"}</small></span><b>${rs(p.r)}</b></div><div style="height:6px;border-radius:4px;background:var(--ln);margin-top:6px"><i style="display:block;height:100%;border-radius:4px;background:var(--br);width:${p.r/mr*100}%"></i></div></div>`).join("");
 const st=(t,v,s)=>`<div><span class="sub">${t}</span><br><b>${v}</b><br><small style="color:var(--mu)">${s}</small></div>`;
 return`<div class="card" style="margin-bottom:14px"><h3 class="d">Sales breakdown</h3><div class="sub">Where the money is coming from, from all live orders today</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:10px 0 4px">${st("Most ordered",esc(mo.n),mo.q+" sold")}${st("Top earner",esc(pl[0].n),rs(pl[0].r))}${st("Best category",esc(cs[0].n),rs(cs[0].r)+" · "+Math.round(cs[0].r/tot*100)+"% of sales")}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:10px"><div><div style="display:flex;justify-content:center"><svg viewBox="0 0 140 140" width="150" height="150" role="img" aria-label="Sales share by category">${seg}<text x="70" y="66" text-anchor="middle" font-size="10" fill="var(--mu)">Total</text><text x="70" y="82" text-anchor="middle" font-size="15" font-weight="800" fill="var(--ink)">${rs(tot)}</text></svg></div>${leg}</div>
 <div><h3 class="d" style="font-size:16px;margin:0 0 4px">Products by revenue</h3>${rows}</div></div></div>`}
function forecast(){
 const a=[...S.week,todaySales()],n=a.length,my=a.reduce((p,c)=>p+c,0)/n,mx=(n-1)/2,sl=a.reduce((p,c,x)=>p+(x-mx)*(c-my),0)/a.reduce((p,c,x)=>p+(x-mx)**2,0),WF=[1.1,.93,.9,.95,1,1.12,1.2];
 const f=[...Array(7)].map((_,i)=>{const d=new Date(Date.now()+(i+1)*864e5),v=Math.round((my+sl*(n+i-mx))*WF[d.getDay()]/10)*10;return{d,v,e:v*(.07+i*.012)}});
 const hi=Math.max(...a,...f.map(x=>x.v+x.e))*1.08,lo=Math.min(...a,...f.map(x=>x.v-x.e))*.85,X=i=>40+i*(390/13),Y=v=>165-(v-lo)/(hi-lo)*145;
 const pa=a.map((v,i)=>X(i)+","+Y(v)).join(" "),pf=[a[n-1],...f.map(x=>x.v)].map((v,i)=>X(n-1+i)+","+Y(v)).join(" ");
 const band=f.map((x,i)=>X(n+i)+","+Y(x.v+x.e)).join(" ")+" "+f.map((x,i)=>X(n+i)+","+Y(x.v-x.e)).reverse().join(" ");
 const lab=i=>new Date(Date.now()+(i-(n-1))*864e5).toLocaleDateString("en-IN",{weekday:"short"});
 const tm=f[0].v,wk=f.reduce((p,x)=>p+x.v,0),lw=a.reduce((p,c)=>p+c,0),ps=Math.round((wk-lw)/lw*100),pt=Math.round((tm-a[n-1])/a[n-1]*100),pk=f.reduce((p,x)=>x.v>p.v?x:p,f[0]);
 const tl={};S.orders.filter(o=>o.s<4).forEach(o=>o.it.forEach(i=>tl[i.n]=(tl[i.n]||0)+i.q));const tp=Object.entries(tl).sort((x,y)=>y[1]-x[1])[0];
 const st=(t,v,c)=>`<div><span class="sub">${t}</span><br><b>${v}</b> ${c||""}</div>`,ar=p=>`<span class="dl ${p>=0?"up":"dn"}">${p>=0?"▲":"▼"} ${Math.abs(p)}%</span>`;
 return`<div class="card" style="margin-bottom:14px"><div class="top" style="margin-bottom:2px"><div><h3 class="d">Sales forecast, next 7 days</h3><div class="sub">Estimate from the last 7 days and the usual weekday pattern. Solid line is actual, dashed is forecast, shaded is the likely range.</div></div></div>
 <svg viewBox="0 0 440 200" width="100%" role="img" aria-label="Sales forecast for the next 7 days">${[0,.5,1].map(g=>`<line x1="38" x2="440" y1="${165-g*145}" y2="${165-g*145}" stroke="var(--ln)"/><text x="32" y="${169-g*145}" text-anchor="end" font-size="10" fill="var(--mu)">${Math.round((lo+(hi-lo)*g)/1000)}k</text>`).join("")}<polygon points="${band}" fill="var(--ac)" opacity=".22"/><line x1="${X(n-1)}" x2="${X(n-1)}" y1="16" y2="165" stroke="var(--mu)" stroke-dasharray="3 4"/><text x="${X(n-1)}" y="11" text-anchor="middle" font-size="10" fill="var(--mu)">Today</text><polyline points="${pa}" fill="none" stroke="var(--br)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><polyline points="${pf}" fill="none" stroke="var(--ac)" stroke-width="3" stroke-dasharray="7 6" stroke-linecap="round"/>${a.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--br)"><title>${lab(i)}: ${rs(v)}</title></circle>`).join("")}${f.map((x,i)=>`<circle cx="${X(n+i)}" cy="${Y(x.v)}" r="3.5" fill="var(--ac)"><title>${lab(n+i)}: about ${rs(x.v)}</title></circle>`).join("")}${[...Array(14)].map((_,i)=>i%2==0?`<text x="${X(i)}" y="186" text-anchor="middle" font-size="10" fill="var(--mu)">${lab(i)}</text>`:"").join("")}</svg>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:8px">${st("Tomorrow","about "+rs(tm),ar(pt))}${st("Next 7 days","about "+rs(wk),ar(ps))}${st("Busiest day",pk.d.toLocaleDateString("en-IN",{weekday:"long"}),"")}${st("Expected orders tomorrow","~"+Math.round(tm/Math.max(1,a[n-1]/Math.max(1,S.orders.filter(o=>o.s<4).length))),"")}</div>
 <p style="margin:12px 0 0">💡 ${pk.d.toLocaleDateString("en-IN",{weekday:"long"})} looks like the busiest day.${tp?" Keep extra stock ready for "+esc(tp[0])+", your top seller right now.":""}</p></div>`}
function overview(){
 const live=S.orders.filter(o=>o.s<3).length,ts=todaySales(),dl=Math.round((ts-S.yday)/S.yday*100),ao=Math.round(ts/Math.max(1,S.orders.filter(o=>o.s<4).length));
 const tally={};S.orders.filter(o=>o.s<4).forEach(o=>o.it.forEach(i=>tally[i.n]=(tally[i.n]||0)+i.q));
 const top=Object.entries(tally).sort((a,b)=>b[1]-a[1]).slice(0,5),mx=top[0]?top[0][1]:1;
 return`<div class="top"><div><h1 class="d">Good evening, Owner</h1><p>Here is how Sneh Kitchen is doing today.</p></div><span class="live">Live</span></div>
 <div class="kpis"><div class="card kpi"><span>Sales today</span><b>${rs(ts)}</b><span class="dl ${dl>=0?"up":"dn"}">${dl>=0?"▲":"▼"} ${Math.abs(dl)}% vs yesterday</span></div>
 <div class="card kpi"><span>Orders today</span><b>${S.orders.filter(o=>o.s<4).length}</b><span class="dl up">▲ 12% vs yesterday</span></div>
 <div class="card kpi"><span>Average order</span><b>${rs(ao)}</b><span class="dl up">▲ 4% vs yesterday</span></div>
 <div class="card kpi"><span>Active orders</span><b>${live}</b><span class="dl" style="color:var(--mu)">${S.orders.filter(o=>o.s==0).length} waiting for you</span></div></div>
 <div class="grid"><div class="card"><h3 class="d">Sales, last 7 days</h3><div class="sub">Today is highlighted</div>${chart()}</div>
 <div class="card"><h3 class="d">Best sellers today</h3><div class="sub">Dishes ordered</div>${top.map(([n,q])=>`<div class="bar"><div>${esc(n)}<div class="t"><i style="width:${q/mx*100}%"></i></div></div><span class="v">${q} sold</span></div>`).join("")}</div></div>
 ${breakdown()}${forecast()}<div class="card"><div class="top" style="margin-bottom:6px"><h3 class="d">Latest orders</h3><button class="btn o" data-p="or">View all</button></div><div class="scroll">${table(S.orders.slice(0,5))}</div></div>`}
function table(l){return`<table><thead><tr><th>Order</th><th>Customer</th><th>Items</th><th>Type</th><th>Total</th><th>Status</th></tr></thead><tbody>${l.map(o=>`<tr data-o="${o.id}"><td><b>#${o.id}</b><br><small style="color:var(--mu)">${o.at}</small></td><td>${esc(o.who)}</td><td>${o.it.map(i=>i.q+"× "+esc(i.n)).join(", ")}</td><td>${o.type}${o.by?'<br><small style="color:var(--mu)">'+o.by+'</small>':""}</td><td><b>${rs(o.total)}</b></td><td>${pill(o.s)}</td></tr>`).join("")||'<tr><td colspan="6" style="text-align:center;color:var(--mu);padding:28px">No orders match.</td></tr>'}</tbody></table>`}
function olist(){const q=S.q.toLowerCase();return S.orders.filter(o=>(S.f=="All"||ST[o.s]==S.f)&&(!q||(o.who+o.id).toLowerCase().includes(q)))}
function orders(){return`<div class="top"><div><h1 class="d">Orders</h1><p>Click an order to see details and update it.</p></div></div>
 <div class="tools"><div class="tabs">${["All",...ST].map(t=>`<button data-f="${t}" aria-pressed="${S.f==t}">${t} (${t=="All"?S.orders.length:S.orders.filter(o=>ST[o.s]==t).length})</button>`).join("")}</div><input id="oq" type="search" placeholder="Search name or order no." value="${esc(S.q)}" aria-label="Search orders"></div>
 <div class="card scroll" id="ot">${table(olist())}</div>`}
function mlist(){const q=S.mq.toLowerCase();return M.filter(m=>!q||m.n.toLowerCase().includes(q))}
function mrows(){return`<table><thead><tr><th>Dish</th><th>Category</th><th>Price</th><th>Availability</th><th></th></tr></thead><tbody>${mlist().map(m=>`<tr><td><span class="dot ${m.v?"":"nv"}"></span>${esc(m.n)}</td><td>${m.c}</td><td>₹ <input class="pin" type="number" min="1" value="${m.p}" data-pr="${m.id}" aria-label="Price of ${esc(m.n)}"></td><td><button class="sw" data-tg="${m.id}" aria-pressed="${!!m.on}">${m.on?"On sale":"Sold out"}</button></td><td><button class="btn r" data-rm="${m.id}">Remove</button></td></tr>`).join("")}</tbody></table>`}
function menu(){return`<div class="top"><div><h1 class="d">Menu</h1><p>Changes show up in the customer app straight away.</p></div></div>
 <div class="card" style="margin-bottom:14px"><div class="form"><div><label for="nm">Dish name</label><input id="nm"></div><div><label for="np">Price (₹)</label><input id="np" type="number" min="1"></div><div><label for="nc">Category</label><select id="nc">${CATS.map(c=>`<option>${c}</option>`).join("")}</select></div><div><label for="nv">Type</label><select id="nv"><option value="1">Veg</option><option value="0">Non-veg</option></select></div><button class="btn" data-add>Add dish</button></div></div>
 <div class="tools"><input id="mq" type="search" placeholder="Search dishes" value="${esc(S.mq)}" aria-label="Search dishes"></div><div class="card scroll" id="mt">${mrows()}</div>`}
function staff(){return`<div class="top"><div><h1 class="d">Delivery staff</h1><p>Add your delivery boys. They log in with their phone number and see only their own deliveries.</p></div></div>
 <div class="card" style="margin-bottom:14px"><div class="form" style="grid-template-columns:2fr 2fr auto"><div><label for="sn">Name</label><input id="sn"></div><div><label for="sp">Phone number</label><input id="sp" type="tel" inputmode="tel"></div><button class="btn" data-addst>Add delivery boy</button></div></div>
 <div class="card scroll"><table><thead><tr><th>Name</th><th>Phone</th><th>On the way</th><th>Delivered today</th><th></th></tr></thead><tbody>${S.staff.map((x,i)=>`<tr><td><b>${esc(x.n)}</b></td><td>${esc(x.ph)}</td><td>${S.orders.filter(o=>o.by==x.n&&o.s>0&&o.s<3).length}</td><td>${S.orders.filter(o=>o.by==x.n&&o.s==3).length}</td><td><button class="btn r" data-rst="${i}">Remove</button></td></tr>`).join("")}</tbody></table></div>`}
const lmR=s=>{const dx=[120,200,280][s%3],dy=[40,70][s%2];return[[40,150],[40,100],[dx,100],[dx,dy]]};
function lmap(o){const P=lmR(o.seed);return`<svg class="lm" viewBox="0 0 320 190" role="img" aria-label="Live delivery map" data-s="${o.seed}" data-st="${o.st||0}" data-dur="${o.dur||1}" data-fix="${o.fix??""}" style="width:100%;display:block;border-radius:14px;background:#E8EDE0;margin:10px 0"><path d="M0 176Q80 150 150 172T320 158V190H0Z" fill="#A9D3EC"/><text x="250" y="182" font-size="9" font-style="italic" fill="#4E8DB5">Ganga</text>${[40,120,200,280].map(x=>`<path d="M${x} 0V170" stroke="#fff" stroke-width="7"/>`).join("")}${[40,100,150].map(y=>`<path d="M0 ${y}H320" stroke="#fff" stroke-width="7"/>`).join("")}${[[60,10],[140,10],[220,10],[60,60],[140,56],[220,60],[300,56],[60,112],[140,112],[220,112],[300,112]].map(p=>`<rect x="${p[0]}" y="${p[1]}" width="44" height="24" rx="4" fill="#D5DDCB"/>`).join("")}<polyline points="${P.map(p=>p.join(",")).join(" ")}" fill="none" stroke="#1F6B3A" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity=".85"/><circle cx="${P[0][0]}" cy="${P[0][1]}" r="12" fill="#1E1E1E" stroke="#fff" stroke-width="2"/><text x="${P[0][0]}" y="${P[0][1]+5}" text-anchor="middle" font-size="13">🍳</text><text x="${P[0][0]+16}" y="${P[0][1]+4}" font-size="10" font-weight="700" fill="#17261F">Sneh Kitchen</text><circle cx="${P[3][0]}" cy="${P[3][1]}" r="12" fill="#C8312B" stroke="#fff" stroke-width="2"/><text x="${P[3][0]}" y="${P[3][1]+5}" text-anchor="middle" font-size="13">🏠</text><text x="${P[3][0]}" y="${P[3][1]-17}" text-anchor="middle" font-size="10" font-weight="700" fill="#17261F">${o.dest?String(o.dest).replace(/[<>&]/g,""):"Customer"}</text><g class="rd" transform="translate(${P[0][0]} ${P[0][1]})"><circle r="12" fill="#F5B400" stroke="#fff" stroke-width="3"/><text y="5" text-anchor="middle" font-size="14">🛵</text></g><rect x="6" y="6" width="96" height="20" rx="10" fill="#fff" opacity=".92"/><text class="kmtx" x="54" y="20" text-anchor="middle" font-size="11" font-weight="700" fill="#17261F"></text></svg>`}
const lmo=o=>{if(o.s==2&&!o.pt)o.pt=Date.now()-12000*(1+o.id%4);return lmap({seed:o.id,st:o.pt||0,dur:90000,fix:o.s==2?"":0,dest:o.who})};
function lmTick(){document.querySelectorAll("svg.lm").forEach(s=>{const P=lmR(+s.dataset.s),L=[0,1,2].map(i=>Math.abs(P[i+1][0]-P[i][0])+Math.abs(P[i+1][1]-P[i][1])),tot=L[0]+L[1]+L[2],t=s.dataset.fix!==""?+s.dataset.fix:Math.min(1,Math.max(0,(Date.now()-s.dataset.st)/s.dataset.dur));let d=t*tot,i=0;while(i<2&&d>L[i]){d-=L[i];i++}const a=P[i],b=P[i+1],f=d/L[i];s.querySelector(".rd").setAttribute("transform",`translate(${a[0]+(b[0]-a[0])*f} ${a[1]+(b[1]-a[1])*f})`);s.querySelector(".kmtx").textContent=t>=1?"Reached":t<=0?"At the kitchen":((1-t)*tot*.01).toFixed(1)+" km away"})}
setInterval(lmTick,250);
function delivery(){
 const me=S.me||"Raju",mine=S.orders.filter(o=>o.by==me),act=mine.filter(o=>o.s>0&&o.s<3),done=mine.filter(o=>o.s==3);
 const cash=act.filter(o=>o.pay=="Cash").reduce((a,o)=>a+o.total,0);
 return`<div class="top" style="margin-bottom:0"><div style="display:flex;gap:12px;align-items:center"><img src="${document.getElementById("lg0").src}" alt="" width="46" height="46" style="border-radius:50%;box-shadow:0 0 0 2px var(--ac);flex:none"><div><h1 class="d">Hi, ${me}</h1><p>Your deliveries for today</p></div></div><span class="live">On duty</span></div>
 <div class="dstats"><div><b>${act.length}</b><span>To deliver</span></div><div><b>${done.length}</b><span>Delivered</span></div><div><b>${rs(cash)}</b><span>Cash to collect</span></div></div>
 ${act.map(o=>`<div class="card"><div class="top" style="margin-bottom:4px"><h3 class="d">#${o.id} · ${esc(o.who)}</h3>${pill(o.s)}</div><p style="margin:0">${esc(o.ad)}</p>${lmo(o)}<p style="margin:4px 0;color:var(--mu)">${o.it.map(i=>i.q+"× "+esc(i.n)).join(", ")}</p><p class="pay" style="margin:6px 0 0">${o.pay=="Cash"?"Collect "+rs(o.total)+" cash":"Paid by UPI. Collect nothing."}</p><div class="acts"><a class="btn o" href="tel:${o.ph}">Call</a><a class="btn o" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.ad)}" target="_blank" rel="noopener">Open map</a></div>${o.s==1?`<button class="btn big" data-pk="${o.id}">Picked up from kitchen</button>`:`<button class="btn big" data-dl="${o.id}">Mark delivered</button>`}</div>`).join("")||'<div class="card" style="text-align:center;color:var(--mu)">No deliveries right now. New orders from the owner will show up here.</div>'}`}
function draw(){
 document.querySelector(".app").hidden=S.role=="d";$("#dv").hidden=S.role!="d";$("#ro").setAttribute("aria-pressed",S.role=="o");$("#rd").setAttribute("aria-pressed",S.role=="d");
 if(S.role=="d"){$("#dr").classList.remove("on");S.open=null;$("#dv").innerHTML=delivery();return}
 const nw=S.orders.filter(o=>o.s==0).length;$("#nn").textContent=nw||"";$("#nn").hidden=!nw;
 document.querySelectorAll("aside .nv").forEach(b=>b.setAttribute("aria-pressed",b.dataset.p==S.pg));
 $("#main").innerHTML=S.pg=="ov"?overview():S.pg=="or"?orders():S.pg=="st"?staff():menu();if(S.open)detail(S.open)}
function detail(id){const o=S.orders.find(x=>x.id==id);if(!o)return;S.open=id;const sub=o.it.reduce((a,b)=>a+b.q*b.p,0);
 $("#dp").innerHTML=`<div class="top" style="margin-bottom:8px"><h2 class="d">Order #${o.id}</h2><button class="btn o" data-x aria-label="Close">Close</button></div>${pill(o.s)}<p style="color:var(--mu);margin:8px 0">${esc(o.who)} · ${o.type} · ${o.pay} · ${o.at}</p>
 <div class="tl">${ST.slice(0,4).map((t,i)=>`<div class="${o.s!=4&&i<=o.s?"on":""}"><i></i>${t}</div>`).join("")}</div>
 ${o.type=="Delivery"&&(o.s==1||o.s==2)?lmo(o):""}${o.it.map(i=>`<div class="ln"><span>${i.q} × ${esc(i.n)}</span><span>${rs(i.q*i.p)}</span></div>`).join("")}<div class="ln"><span>Delivery fee</span><span>${rs(o.total-sub)}</span></div><div class="ln t"><span>Total</span><span>${rs(o.total)}</span></div>
 ${o.type=="Delivery"&&o.s<3?`<label for="as" style="display:block;font-weight:600;margin-top:16px">Delivery boy</label><select id="as" data-as="${o.id}" style="width:100%;margin-top:4px"><option value="">Not assigned</option>${S.staff.map(x=>`<option${o.by==x.n?" selected":""}>${x.n}</option>`).join("")}</select>`:""}<div style="display:flex;gap:8px;margin-top:18px">${o.s<3?`<button class="btn" data-adv="${o.id}">Mark ${ST[o.s+1].toLowerCase()}</button>`:""}${o.s<3?`<button class="btn r" data-cx="${o.id}">Cancel order</button>`:""}</div>`;$("#dr").classList.add("on")}
let tt;function toast(m){const t=$("#ts");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),4500)}
document.addEventListener("click",e=>{const b=e.target.closest("[data-p],[data-f],[data-o],[data-adv],[data-cx],[data-x],[data-tg],[data-rm],[data-add],[data-role],[data-pk],[data-dl],[data-addst],[data-rst]");
 if(!b){if(e.target.id=="dr"){$("#dr").classList.remove("on");S.open=null}return}const d=b.dataset;
 if(d.p){S.pg=d.p;$("#dr").classList.remove("on");S.open=null}
 else if(d.f)S.f=d.f;else if(d.role)S.role=d.role;else if(d.pk){const o=S.orders.find(o=>o.id==d.pk);o.s=2;o.pt=Date.now()}else if(d.dl){S.orders.find(o=>o.id==d.dl).s=3;toast("Delivered. The owner dashboard is updated.")}else if(d.rst)S.staff.splice(+d.rst,1);else if(d.addst!=null){const n=$("#sn").value.trim(),p=$("#sp").value.trim();if(!n||p.length<10){toast("Enter a name and a 10-digit phone number.");return}S.staff.push({n,ph:p});toast(n+" added. They can now log in with "+p+".")}
 else if(d.o){detail(+d.o);return}
 else if(d.adv){S.orders.find(o=>o.id==d.adv).s++}
 else if(d.cx){S.orders.find(o=>o.id==d.cx).s=4}
 else if(d.x!=null){$("#dr").classList.remove("on");S.open=null;return}
 else if(d.tg){const m=M.find(x=>x.id==d.tg);m.on=m.on?0:1}
 else if(d.rm)M=M.filter(x=>x.id!=d.rm);
 else if(d.add!=null){const n=$("#nm").value.trim(),p=+$("#np").value;if(!n||p<=0){$("#nm").focus();toast("Enter a dish name and a price.");return}M.unshift({id:Date.now(),n,p,c:$("#nc").value,v:+$("#nv").value,on:1});toast(n+" added to the menu.")}
 draw();if(S.open&&!$("#dr").classList.contains("on"))$("#dr").classList.add("on")});
document.addEventListener("input",e=>{const t=e.target;
 if(t.id=="oq"){S.q=t.value;$("#ot").innerHTML=table(olist())}
 else if(t.id=="mq"){S.mq=t.value;$("#mt").innerHTML=mrows()}
 else if(t.dataset.pr){const m=M.find(x=>x.id==t.dataset.pr);if(+t.value>0)m.p=+t.value}});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){$("#dr").classList.remove("on");S.open=null}});
document.addEventListener("change",e=>{const t=e.target;if(t.dataset.as){const o=S.orders.find(x=>x.id==t.dataset.as);o.by=t.value||null;toast(o.by?"Assigned to "+o.by:"Delivery boy removed");draw()}});
let sim=0;{const hm=location.hash.match(/^#as-(\w+)$/);if(hm){const u=hm[1];if(u!="owner"){S.role="d";S.me=u[0].toUpperCase()+u.slice(1)}document.querySelector(".demo").style.display="none"}}setTimeout(function nx(){if(sim++>=4)return;const o=mk(0,0,new Date().toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}));o.id=S.seq++;S.orders.unshift(o);toast("New order #"+o.id+" from "+o.who+" · "+rs(o.total));if(!$("#dr").classList.contains("on"))draw();else{$("#nn").textContent=S.orders.filter(x=>x.s==0).length}setTimeout(nx,22000)},7000);
draw();
</script>
</body>
</html>
